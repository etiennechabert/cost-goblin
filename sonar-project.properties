sonar.organization=etiennechabert
sonar.projectKey=etiennechabert_cost-goblin

sonar.sources=packages/core/src,packages/ui/src,packages/desktop/src,packages/mcp/src,scripts/gcp-focus-exporter
sonar.tests=packages/core/src/__tests__,packages/ui/src/__tests__,packages/desktop/src/__tests__,packages/mcp/src/__tests__,scripts/gcp-focus-exporter
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs
# Only generated data is fully out of scope. Fixture GENERATORS and test
# infrastructure stay analyzed for bugs/smells (MockCostApi is even re-exported
# from @costgoblin/ui's public entry point) — they are excluded from the
# coverage denominator below instead.
sonar.exclusions=**/node_modules/**,**/dist/**,**/out/**,**/__fixtures__/synthetic/**

# Excluded from the coverage denominator, NOT from analysis:
# - __fixtures__ / non-test files in __tests__ (generators, mock APIs, vitest
#   setup, worker stubs) are test infrastructure — testing the test tools
#   would be circular.
# - preload.ts is one-line `ipcRenderer.invoke` mappings behind contextBridge —
#   the TypeScript CostApi interface is the real guard; unit tests would
#   restate the file.
# - duckdb-worker.ts / sync-worker.ts ARE tested (duckdb-worker.test.ts,
#   sync-worker.test.ts drive the built out/worker/*.cjs bundles through real
#   worker_threads), but coverage instruments the TS source, so the bundle
#   executions can never attribute back to these files.
sonar.coverage.exclusions=**/__fixtures__/**,**/__tests__/**,packages/desktop/src/preload/preload.ts,packages/desktop/src/main/duckdb-worker.ts,packages/desktop/src/main/sync-worker.ts

sonar.typescript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info

sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info
