[package]
name = "costgoblin-tauri-spike"
version = "0.0.0"
description = "CostGoblin Tauri + Rust core spike (issue #360)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
duckdb = { version = "1", features = ["bundled"] }
aws-config = "1"
aws-sdk-organizations = "1"
aws-sdk-s3 = "1"
aws-sdk-ssm = "1"
aws-smithy-types = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tiny_http = "0.12"

[profile.dev]
# DuckDB's bundled C++ is huge; without some opt the debug build is painfully
# slow to run. opt-level 1 on deps keeps incremental Rust builds fast while
# making the bundled libduckdb usable.
[profile.dev.package."*"]
opt-level = 2
