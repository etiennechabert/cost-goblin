appId: com.etiennechabert.costgoblin
productName: CostGoblin
copyright: Copyright © 2026 Etienne Chabert

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

asarUnpack:
  - "**/node_modules/@duckdb/node-api/**/*"

mac:
  category: public.app-category.finance
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: null
  entitlementsInherit: null

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CostGoblin

publish:
  provider: github
  owner: etiennechabert
  repo: cost-goblin
  releaseType: release

