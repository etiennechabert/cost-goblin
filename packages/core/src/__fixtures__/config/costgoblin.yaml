providers:
  - name: aws-main
    type: aws
    credentialsProfile: test-profile
    sync:
      daily:
        bucket: s3://test-cur-bucket/daily/
        retentionDays: 365
      hourly:
        bucket: s3://test-cur-bucket/hourly/
        retentionDays: 30
      costOptimization:
        bucket: s3://test-cur-bucket/cost-optimization/
        retentionDays: 90
      intervalMinutes: 60

defaults:
  periodDays: 30
  costMetric: unblended_cost
  lagDays: 1
