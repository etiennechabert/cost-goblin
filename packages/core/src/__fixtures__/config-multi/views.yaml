views:
  - id: overview
    name: Cost Overview
    builtIn: true
    rows:
      - widgets:
          - id: overview-summary
            type: summary
            size: small
            metric: total
          - id: overview-histogram
            type: stackedBar
            size: large
            groupBy: service
      - widgets:
          - id: overview-pie-account
            type: pie
            size: medium
            groupBy: account
          - id: overview-pie-region
            type: pie
            size: medium
            groupBy: region
          - id: overview-pie-service
            type: pie
            size: medium
            groupBy: service
      - widgets:
          - id: overview-breakdown
            type: table
            size: full
            enabledColumns:
              - cost
              - resource_id
              - description
  - id: trend-lines
    name: Trend lines
    builtIn: true
    rows:
      - widgets:
          - id: trends-summary
            type: summary
            size: small
            metric: total
          - id: trends-line-service
            type: line
            size: large
            groupBy: service
            topN: 6
      - widgets:
          - id: trends-line-account
            type: line
            size: medium
            groupBy: account
            topN: 6
          - id: trends-line-region
            type: line
            size: medium
            groupBy: region
            topN: 6
  - id: stacked
    name: Stacked over time
    builtIn: true
    rows:
      - widgets:
          - id: stacked-summary
            type: summary
            size: small
            metric: total
          - id: stacked-service
            type: stackedBar
            size: large
            groupBy: service
      - widgets:
          - id: stacked-account
            type: stackedBar
            size: full
            groupBy: account
  - id: top-n
    name: Top N
    builtIn: true
    rows:
      - widgets:
          - id: topn-summary
            type: summary
            size: small
            metric: total
          - id: topn-service
            type: topNBar
            size: large
            groupBy: service
            topN: 12
      - widgets:
          - id: topn-account
            type: topNBar
            size: medium
            groupBy: account
            topN: 12
          - id: topn-family
            type: topNBar
            size: medium
            groupBy: service_category
            topN: 12
  - id: distribution
    name: Distribution
    builtIn: true
    rows:
      - widgets:
          - id: dist-account
            type: pie
            size: medium
            groupBy: account
          - id: dist-region
            type: pie
            size: medium
            groupBy: region
      - widgets:
          - id: dist-service
            type: pie
            size: medium
            groupBy: service
          - id: dist-family
            type: pie
            size: medium
            groupBy: service_category
  - id: treemap
    name: Treemap
    builtIn: true
    rows:
      - widgets:
          - id: treemap-summary
            type: summary
            size: small
            metric: total
          - id: treemap-service
            type: treemap
            size: large
            groupBy: service
      - widgets:
          - id: treemap-account
            type: treemap
            size: full
            groupBy: account
  - id: heatmap
    name: Heatmap
    builtIn: true
    rows:
      - widgets:
          - id: heatmap-summary
            type: summary
            size: small
            metric: total
          - id: heatmap-service
            type: heatmap
            size: large
            groupBy: service
            topN: 10
      - widgets:
          - id: heatmap-account
            type: heatmap
            size: full
            groupBy: account
            topN: 10
  - id: movers
    name: Movers
    builtIn: true
    rows:
      - widgets:
          - id: movers-summary
            type: summary
            size: small
            metric: delta
          - id: movers-service
            type: bubble
            size: large
            groupBy: service
      - widgets:
          - id: movers-account
            type: bubble
            size: full
            groupBy: account
  - id: line-items
    name: Line items
    builtIn: true
    rows:
      - widgets:
          - id: items-total
            type: summary
            size: small
            metric: total
          - id: items-delta
            type: summary
            size: small
            metric: delta
          - id: items-count
            type: summary
            size: small
            metric: entityCount
      - widgets:
          - id: items-table
            type: table
            size: full
            enabledColumns:
              - cost
              - service
              - account_name
              - resource_id
              - description
  - id: drivers
    name: Cost drivers
    builtIn: true
    rows:
      - widgets:
          - id: drivers-summary
            type: summary
            size: small
            metric: delta
          - id: drivers-service
            type: waterfall
            size: large
            groupBy: service
            topN: 8
      - widgets:
          - id: drivers-account
            type: waterfall
            size: full
            groupBy: account
            topN: 8
  - id: price-volume
    name: Price vs volume
    builtIn: true
    rows:
      - widgets:
          - id: pv-summary
            type: summary
            size: small
            metric: delta
          - id: pv-service
            type: priceVolume
            size: large
            groupBy: service
            topN: 6
      - widgets:
          - id: pv-family
            type: priceVolume
            size: full
            groupBy: service_category
            topN: 8
  - id: pacing
    name: Budget pacing
    builtIn: true
    rows:
      - widgets:
          - id: pacing-summary
            type: summary
            size: small
            metric: total
          - id: pacing-burndown
            type: burndown
            size: large
      - widgets:
          - id: pacing-line
            type: line
            size: full
            groupBy: service
            topN: 6
  - id: concentration
    name: Concentration
    builtIn: true
    rows:
      - widgets:
          - id: conc-summary
            type: summary
            size: small
            metric: total
          - id: conc-service
            type: pareto
            size: large
            groupBy: service
      - widgets:
          - id: conc-account
            type: pareto
            size: full
            groupBy: account
