version: 2
updates:
  # npm dependencies across the whole workspace. A single "/" config covers
  # every workspace package (core, ui, desktop, mcp) AND updates the shared
  # root package-lock.json in the same PR. Per-package configs are deliberately
  # NOT used: with one root lockfile, a sub-package-only PR leaves the lockfile
  # out of sync and every `npm ci` job fails.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      all-actions:
        patterns:
          - "*"
