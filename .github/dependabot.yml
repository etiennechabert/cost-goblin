version: 2
updates:
  # npm dependencies across the whole workspace. A single "/" config covers
  # every workspace package (core, ui, desktop, mcp) AND updates the shared
  # root package-lock.json in the same PR. Per-package configs are deliberately
  # NOT used: with one root lockfile, a sub-package-only PR leaves the lockfile
  # out of sync and every `npm ci` job fails.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    # Wait 7 days after a version is published before proposing it. Nearly every
    # npm account-takeover (event-stream, ua-parser-js, Shai-Hulud) is caught and
    # the malicious version yanked within 24-72h, so a week of latency turns most
    # of them into a non-event we never even see a PR for.
    #
    # This does NOT delay security fixes: cooldown applies to *version* updates
    # only. Dependabot security updates (driven by the advisory database) ignore
    # it entirely and still open immediately, so `audit-ci` always gets its patch
    # without waiting.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # TypeScript majors are held back until typescript-eslint supports them.
      # Every @typescript-eslint release to date — including the 8.66.x canary —
      # still declares `peerDependencies.typescript: ">=4.8.4 <6.1.0"`, so a TS 7
      # bump makes `npm ci` fail outright with ERESOLVE. Because the group below
      # matches "*", that single incompatible package takes down the whole weekly
      # dependency PR (see #527), not just the TypeScript bump.
      # Remove this entry once @typescript-eslint widens its peer range to TS 7;
      # minor/patch TypeScript updates are unaffected and still flow through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Same 7-day soak as npm. Actions are already SHA-pinned and restricted to an
    # allowlist (actions/*, github/*, SonarSource/*), so this is defence in depth
    # against a compromised release of an otherwise-trusted action.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      all-actions:
        patterns:
          - "*"

  # The signup Cloudflare Worker. It has its OWN package-lock.json, so unlike the
  # workspace packages it needs its own config — the "/" entry above does not see
  # it, and until now it received security updates only (that is what #534 was).
  # Its deps run in production on the deployed Worker.
  - package-ecosystem: "npm"
    directory: "/workers/signup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Explicit, like the root entry: the default is `auto`, which for anything it
    # classifies as a library WIDENS ranges instead of bumping them.
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      signup-worker:
        patterns:
          - "*"

  # The GCP FOCUS exporter. It has NO lockfile — its Dockerfile runs a bare
  # `npm install --omit=dev`, so whatever resolves at image-build time is what
  # ships. Dependabot can still update the manifest ranges, which is the only
  # pinning this deployment has.
  #
  # NOTE: @google-cloud/bigquery is pinned to an exact version on purpose — the
  # DATE/TIMESTAMP parameter wrapping in export-focus.mjs depends on that
  # client's parameter encoding (see `_dependencyNote` in its package.json).
  # Re-verify `temporalParam` before merging any bump of it.
  - package-ecosystem: "npm"
    directory: "/scripts/gcp-focus-exporter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Critical here, not just consistency: the default `auto` may WIDEN ranges,
    # which would rewrite the exact "8.3.1" bigquery pin into a range and destroy
    # the very guarantee the note above depends on.
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Majors held back entirely — a major of the BigQuery client is exactly
      # where parameter-encoding behaviour changes. Minor/patch still flow, but
      # excluded from the group below so they arrive as their own clearly-titled
      # PR instead of hiding inside a generic grouped bump.
      - dependency-name: "@google-cloud/bigquery"
        update-types: ["version-update:semver-major"]
    groups:
      gcp-exporter:
        patterns:
          - "*"
        exclude-patterns:
          - "@google-cloud/bigquery"

  # The exporter's Docker base image (node:22-slim). Nothing else tracked it, so
  # the base image only ever moved when someone edited the Dockerfile by hand.
  - package-ecosystem: "docker"
    directory: "/scripts/gcp-focus-exporter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
