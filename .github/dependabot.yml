version: 2
updates:
  # npm dependencies across the whole workspace. A single "/" config covers
  # every workspace package (core, ui, desktop, mcp) AND updates the shared
  # root package-lock.json in the same PR. Per-package configs are deliberately
  # NOT used: with one root lockfile, a sub-package-only PR leaves the lockfile
  # out of sync and every `npm ci` job fails.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    # Wait 7 days after a version is published before proposing it. Nearly every
    # npm account-takeover (event-stream, ua-parser-js, Shai-Hulud) is caught and
    # the malicious version yanked within 24-72h, so a week of latency turns most
    # of them into a non-event we never even see a PR for.
    #
    # This does NOT delay security fixes: cooldown applies to *version* updates
    # only. Dependabot security updates (driven by the advisory database) ignore
    # it entirely and still open immediately, so `audit-ci` always gets its patch
    # without waiting.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # TypeScript majors are held back until typescript-eslint supports them.
      # Every @typescript-eslint release to date — including the 8.66.x canary —
      # still declares `peerDependencies.typescript: ">=4.8.4 <6.1.0"`, so a TS 7
      # bump makes `npm ci` fail outright with ERESOLVE. Because the group below
      # matches "*", that single incompatible package takes down the whole weekly
      # dependency PR (see #527), not just the TypeScript bump.
      # Remove this entry once @typescript-eslint widens its peer range to TS 7;
      # minor/patch TypeScript updates are unaffected and still flow through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @sentry/cli only runs in release.yml (debug-ID inject + uploads), and
      # nothing in ci.yml exercises it, so a breaking major would pass the PR and
      # surface only at tag time — as a failed release. Take majors by hand,
      # checking the `sourcemaps inject` / `debug-files upload` CLI and that the
      # binary still ships in script-free @sentry/cli-<platform> optionals (its
      # install script is denied in package.json#allowScripts).
      - dependency-name: "@sentry/cli"
        update-types: ["version-update:semver-major"]
      # The root `vite` and `ast-v8-to-istanbul` devDependencies are what
      # executableLines (packages/core/src/e2e-coverage) uses to reproduce
      # vitest's coverage pipeline; the root overrides force vitest and
      # @vitest/coverage-v8 onto the same copies. A major moves that pipeline
      # (vite 8 transforms with oxc, not esbuild) and ast-v8-to-istanbul's only
      # consumer declares ^1.0.5 — take both by hand, checking that the e2e and
      # unit lcov line sets still agree. This also holds back packages/desktop's
      # own vite majors.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ast-v8-to-istanbul"
        update-types: ["version-update:semver-major"]
      # google-auth-library must stay the single copy @google-cloud/storage uses:
      # createGcsStorage hands Storage our GoogleAuth, which it only trusts when it
      # is `instanceof` its own copy (scripts/ci/packaged-deps.test.mjs pins this).
      # storage 8 still depends on ^9, so a major of ours installs a second copy,
      # fails tsc in gcs-storage.ts, and took the whole weekly group down with it
      # (#673). Remove this entry, bumping both by hand in one PR, once
      # @google-cloud/storage's own google-auth-library range reaches the latest
      # google-auth-library major (Dependabot proposes the latest, not the next).
      - dependency-name: "google-auth-library"
        update-types: ["version-update:semver-major"]
    groups:
      # The other half of that coupling: a storage major that moves its
      # google-auth-library range past the ^9 held above also installs a second
      # copy. Its own PR (first matching group wins) fails packaged-deps.test.mjs
      # alone, as the signal to take both majors together, instead of taking
      # all-dependencies down again.
      google-cloud-storage-major:
        patterns:
          - "@google-cloud/storage"
        update-types:
          - "major"
      all-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Same 7-day soak as npm. Actions are already SHA-pinned and restricted to an
    # allowlist (actions/*, github/*, SonarSource/*), so this is defence in depth
    # against a compromised release of an otherwise-trusted action.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      all-actions:
        patterns:
          - "*"

  # The signup Cloudflare Worker. It has its OWN package-lock.json, so unlike the
  # workspace packages it needs its own config — the "/" entry above does not see
  # it, and until now it received security updates only (that is what #534 was).
  # Its deps run in production on the deployed Worker.
  - package-ecosystem: "npm"
    directory: "/workers/signup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Explicit, like the root entry: the default is `auto`, which for anything it
    # classifies as a library WIDENS ranges instead of bumping them.
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      signup-worker:
        patterns:
          - "*"

  # The GCP FOCUS exporter. It has its OWN package-lock.json, which its
  # Dockerfile installs verbatim (`npm ci --omit=dev --ignore-scripts`), so the
  # "/" entry above does not see it. Root .npmrc's min-release-age does not
  # reach this directory either: the cooldown below is its only soak.
  #
  # NOTE: @google-cloud/bigquery is pinned to an exact version on purpose — the
  # DATE/TIMESTAMP parameter wrapping in export-focus.mjs depends on that
  # client's parameter encoding (see `_dependencyNote` in its package.json).
  # Re-verify `temporalParam` before merging any bump of it.
  - package-ecosystem: "npm"
    directory: "/scripts/gcp-focus-exporter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Critical here, not just consistency: the default `auto` may WIDEN ranges,
    # which would rewrite the exact "8.3.1" bigquery pin into a range and destroy
    # the very guarantee the note above depends on.
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Majors held back entirely — a major of the BigQuery client is exactly
      # where parameter-encoding behaviour changes. Minor/patch still flow, but
      # excluded from the group below so they arrive as their own clearly-titled
      # PR instead of hiding inside a generic grouped bump.
      - dependency-name: "@google-cloud/bigquery"
        update-types: ["version-update:semver-major"]
    groups:
      gcp-exporter:
        patterns:
          - "*"
        exclude-patterns:
          - "@google-cloud/bigquery"

  # The exporter's Docker base image (node:22-slim). Nothing else tracked it, so
  # the base image only ever moved when someone edited the Dockerfile by hand.
  - package-ecosystem: "docker"
    directory: "/scripts/gcp-focus-exporter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
