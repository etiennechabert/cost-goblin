name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    environment: release
    strategy:
      # Exactly ONE job per platform. electron-builder.yml pins the arch list
      # per target, so a single invocation builds every arch for the platform
      # (CLI --x64/--arm64 flags do NOT narrow it). Splitting mac into per-arch
      # jobs made both jobs build BOTH archs and race on publishing: each
      # "overwrite published file" replaced the other's binaries, leaving a
      # latest-mac.yml whose sha512/size didn't match the surviving zips —
      # which made every macOS auto-update fail checksum validation (v0.2.6).
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Fail fast if someone tags `v0.2.5` without first bumping
      # package.json to 0.2.5. Without this guard, electron-builder
      # publishes artifacts named for the old version and (worse) silently
      # skips uploads when the matching release is >2h old, leaving a
      # tag with no binaries attached — exactly what happened to v0.2.5.
      - name: Verify package.json version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg_v=$(node -p "require('./package.json').version")
          desktop_v=$(node -p "require('./packages/desktop/package.json').version")
          if [ "$pkg_v" != "$tag" ] || [ "$desktop_v" != "$tag" ]; then
            echo "::error::Tag v$tag does not match package.json ($pkg_v) / packages/desktop/package.json ($desktop_v). Bump both, push, then re-tag."
            exit 1
          fi
          echo "OK: tag v$tag == package.json $pkg_v"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build app bundles
        run: npm run build --workspaces --if-present
        env:
          # Bakes the default DSN into the main bundle (electron-vite inlines
          # import.meta.env.MAIN_VITE_*). Empty when the var isn't set →
          # telemetry stays dark. Not a secret, so a variable not a secret.
          MAIN_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}

      # Inject debug IDs into the built JS (so shipped bundles match the maps)
      # and upload source maps, so renderer/main stack traces are readable in
      # Sentry. Runs before packaging so electron-builder ships the injected JS.
      # Electron/Chromium's own native frames are symbolicated by Sentry's symbol
      # server; third-party native modules are handled by the next step.
      # Skipped entirely when Sentry isn't configured.
      - name: Upload source maps to Sentry
        if: vars.SENTRY_ORG != ''
        # Source maps are an observability nicety, not a release artifact — a
        # partial Sentry config (org set but token missing/expired) must never
        # fail the release. Soft-fail and ship; traces just stay unminified.
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://de.sentry.io' }}
        run: |
          set -euo pipefail
          REL="costgoblin@${GITHUB_REF#refs/tags/v}"
          npx --yes @sentry/cli@^2 sourcemaps inject packages/desktop/out
          npx --yes @sentry/cli@^2 sourcemaps upload --release "$REL" packages/desktop/out

      # Native crashes inside DuckDB (the duckdb.node addon + the libduckdb
      # engine) land in Crashpad minidumps. Sentry has no symbols for
      # third-party native modules, so without their debug files it reports
      # "A required debug information file was missing" and native frames stay
      # unresolved (COSTGOBLIN-4). The prebuilt binaries carry no DWARF but ship
      # a symbol table + unwind info — enough for function-level frames.
      #
      # We ship BOTH x64 and arm64 for every OS (electron-builder.yml), but each
      # GitHub runner is single-arch, so `npm ci` installs only the @duckdb
      # binding matching the runner's own os/cpu — uploading node_modules/@duckdb
      # would silently miss every other arch. Instead fetch all eight
      # @duckdb/node-bindings-<os>-<arch> tarballs (`npm pack` ignores the os/cpu
      # install gate) at the version this build resolved and upload them
      # together. Debug files are project-global (matched by debug ID, not tied
      # to a build), so this runs once on Linux and needs no --release.
      # sentry-cli uploads whatever is usable and skips the rest: macOS + Linux
      # (every arch, incl. musl) symbolicate; Windows' duckdb.dll is stripped
      # with no PDB shipped, so only its duckdb.node addon resolves. Soft-fail
      # like the source maps — never block a release.
      - name: Upload native debug files to Sentry
        if: matrix.platform == 'linux' && vars.SENTRY_ORG != ''
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://de.sentry.io' }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/duckdb-dif"
          mkdir -p "$dest"
          # All eight per-arch packages are node-bindings' optionalDependencies
          # and share its version — derive both so a DuckDB bump needs no edit.
          specs=$(node -p "Object.entries(require('@duckdb/node-bindings/package.json').optionalDependencies||{}).map(([k,v])=>k+'@'+v).join(' ')")
          ( cd "$dest"
            for spec in $specs; do npm pack "$spec"; done
            for tgz in *.tgz; do d="${tgz%.tgz}"; mkdir -p "$d"; tar -xzf "$tgz" -C "$d"; done )
          npx --yes @sentry/cli@^2 debug-files upload "$dest"

      - name: Build installers
        run: npx --no-install electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}

  # electron-builder uploads to a DRAFT release with an empty body. This job
  # runs after every matrix build has uploaded its assets: it sets the body to
  # GitHub's auto-generated changelog (PR titles + commit subjects since the
  # previous tag) AND publishes the draft (--draft=false), so the release only
  # goes live — and only becomes visible to auto-updaters — once it is
  # complete. Single job to avoid the matrix-vs-release-body race that would
  # happen if we patched the body from inside the build job.
  notes:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=$(gh api -X POST "repos/${GITHUB_REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            --jq .body)
          gh release edit "${TAG}" --repo "${GITHUB_REPO}" --notes "${NOTES}" --draft=false --latest
