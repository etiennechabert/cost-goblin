name: Release

on:
  push:
    tags:
      - 'v*'

# Serialize runs for a given tag so a re-tag/re-run can never race the in-flight
# release's manifest upload. Never cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    environment: release
    strategy:
      # ONE job per (os, arch) on a MATCHING-arch runner. The 8 @duckdb
      # node-bindings packages are os/cpu-gated, so `npm ci` installs only the
      # runner's host-arch binding; with npmRebuild:false electron-builder ships
      # node_modules as-is. Building each arch on its own native runner is what
      # guarantees the right DuckDB binary ends up in each installer — the old
      # single-runner-builds-both-archs setup shipped the wrong-arch binding to
      # every secondary arch (Intel-Mac dmg, arm64 Win/Linux) and crashed there.
      #
      # Each job builds EXACTLY its one arch (electron-builder.yml no longer pins
      # arch per target, so the --x64/--arm64 flag now narrows it) and publishes
      # NOTHING (`--publish never`) — it uploads its dist/ as an artifact. The
      # `publish` job then merges the per-arch update manifests and uploads
      # everything to one draft release. That is what keeps the two arch jobs of a
      # platform from clobbering each other's latest*.yml — the race that left a
      # manifest whose sha512/size didn't match the surviving binaries and broke
      # every macOS auto-update (v0.2.6).
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel    # Intel (x64)
            platform: mac
            arch: x64
          - os: macos-14          # Apple Silicon (arm64)
            platform: mac
            arch: arm64
          - os: windows-latest    # x64
            platform: win
            arch: x64
          - os: windows-11-arm    # arm64
            platform: win
            arch: arm64
          - os: ubuntu-latest     # x64
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm  # arm64
            platform: linux
            arch: arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail fast if someone tags `v0.2.5` without first bumping
      # package.json to 0.2.5. Without this guard, electron-builder
      # publishes artifacts named for the old version and (worse) silently
      # skips uploads when the matching release is >2h old, leaving a
      # tag with no binaries attached — exactly what happened to v0.2.5.
      - name: Verify package.json version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg_v=$(node -p "require('./package.json').version")
          desktop_v=$(node -p "require('./packages/desktop/package.json').version")
          if [ "$pkg_v" != "$tag" ] || [ "$desktop_v" != "$tag" ]; then
            echo "::error::Tag v$tag does not match package.json ($pkg_v) / packages/desktop/package.json ($desktop_v). Bump both, push, then re-tag."
            exit 1
          fi
          echo "OK: tag v$tag == package.json $pkg_v"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The entire fix rests on "npm ci on a matching-arch runner installs only
      # this arch's @duckdb binding." Assert it before doing any expensive build
      # work, so a runner whose Node reports the wrong process.arch (e.g. an
      # emulated x64 Node on windows-11-arm) fails LOUDLY here instead of silently
      # shipping a wrong-arch binary that only crashes on a user's machine.
      - name: Verify host-arch DuckDB binding was installed
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            mac)   os=darwin ;;
            win)   os=win32 ;;
            linux) os=linux ;;
          esac
          want="node_modules/@duckdb/node-bindings-${os}-${{ matrix.arch }}"
          other_arch=$([ "${{ matrix.arch }}" = x64 ] && echo arm64 || echo x64)
          echo "runner node process.arch=$(node -p process.arch); target=${{ matrix.arch }}"
          test -f "$want/duckdb.node" || {
            echo "::error::Missing $want/duckdb.node — npm ci installed the wrong-arch DuckDB binding (runner process.arch != ${{ matrix.arch }}?). Refusing to ship a broken installer.";
            exit 1;
          }
          if [ -d "node_modules/@duckdb/node-bindings-${os}-${other_arch}" ]; then
            echo "::error::Foreign-arch binding node-bindings-${os}-${other_arch} is present — this installer would ship two archs. Aborting.";
            exit 1;
          fi
          echo "OK: only ${os}-${{ matrix.arch }} binding present"

      - name: Build app bundles
        run: npm run build --workspaces --if-present
        env:
          # Bakes the default DSN into the main bundle (electron-vite inlines
          # import.meta.env.MAIN_VITE_*). Empty when the var isn't set →
          # telemetry stays dark. Not a secret, so a variable not a secret.
          MAIN_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}

      # Inject debug IDs into the built JS (so shipped bundles match the maps)
      # and upload source maps, so renderer/main stack traces are readable in
      # Sentry. Runs before packaging so electron-builder ships the injected JS.
      # `sourcemaps inject` rewrites packages/desktop/out in place, so every arch
      # job runs it (the renderer/main JS is arch-independent; Sentry dedupes the
      # maps by debug ID). Electron/Chromium's own native frames are symbolicated
      # by Sentry's symbol server; third-party native modules are handled by the
      # next step. Skipped entirely when Sentry isn't configured.
      - name: Upload source maps to Sentry
        if: vars.SENTRY_ORG != ''
        # Source maps are an observability nicety, not a release artifact — a
        # partial Sentry config (org set but token missing/expired) must never
        # fail the release. Soft-fail and ship; traces just stay unminified.
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://de.sentry.io' }}
        run: |
          set -euo pipefail
          REL="costgoblin@${GITHUB_REF#refs/tags/v}"
          npx --yes @sentry/cli@^2 sourcemaps inject packages/desktop/out
          npx --yes @sentry/cli@^2 sourcemaps upload --release "$REL" packages/desktop/out

      # Native crashes inside DuckDB (the duckdb.node addon + the libduckdb
      # engine) land in Crashpad minidumps. Sentry has no symbols for third-party
      # native modules, so without their debug files it reports "A required debug
      # information file was missing" and native frames stay unresolved
      # (COSTGOBLIN-4). The prebuilt binaries carry no DWARF but ship a symbol
      # table + unwind info — enough for function-level frames.
      #
      # Now that each arch builds on its own native runner, node_modules/@duckdb
      # already holds exactly the arch this job ships (asserted above), so upload
      # it directly — across the six jobs every shipped arch is covered. (No musl
      # variant: we don't ship a musl build.) Debug files are project-global
      # (matched by debug ID, not tied to a build), so no --release. Soft-fail
      # like the source maps — never block a release.
      - name: Upload native debug files to Sentry
        if: vars.SENTRY_ORG != ''
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://de.sentry.io' }}
        run: npx --yes @sentry/cli@^2 debug-files upload node_modules/@duckdb

      # Build the single arch this runner natively is. --publish never: the
      # binaries + per-arch latest*.yml land in dist/ but nothing is uploaded to
      # the release here — the `publish` job aggregates all arches so the manifests
      # can be merged before going live.
      - name: Build installers
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}

      # Distributables + blockmaps + the per-arch update manifest only — never the
      # huge *-unpacked/ dirs or builder-*.yml. Globs that match nothing on a given
      # platform are silently skipped; every platform matches at least one file.
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml

  # Aggregate every arch's artifacts, merge the shared update manifests, and
  # upload the whole set to ONE draft release. Runs only after all six build jobs
  # succeed (a failed arch ⇒ this is skipped ⇒ no partial release). The draft
  # stays invisible to auto-updaters until the `notes` job flips it live, so there
  # is never a window where a half-uploaded manifest is served on a fresh release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download all dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      # Collect every binary, then build the published manifest set:
      #   - linux manifests are already arch-specific (latest-linux.yml +
      #     latest-linux-arm64.yml — electron-updater fetches the arch-suffixed
      #     name on arm64), so copy both as-is, no merge.
      #   - mac and win share one manifest across their two arch jobs, so merge the
      #     per-arch copies (x64 first — see merge-update-manifests.mjs). The merged
      #     manifest still lists every arch's real sha512/size.
      - name: Merge update manifests and stage release assets
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save js-yaml@^4

          mkdir -p upload
          find artifacts -type f \( \
            -name '*.dmg' -o -name '*.dmg.blockmap' -o \
            -name '*.zip' -o -name '*.zip.blockmap' -o \
            -name '*.exe' -o -name '*.exe.blockmap' -o \
            -name '*.AppImage' -o -name '*.deb' \) -exec cp {} upload/ \;

          cp artifacts/dist-linux-x64/latest-linux.yml upload/
          cp artifacts/dist-linux-arm64/latest-linux-arm64.yml upload/

          node .github/scripts/merge-update-manifests.mjs upload/latest-mac.yml \
            artifacts/dist-mac-x64/latest-mac.yml \
            artifacts/dist-mac-arm64/latest-mac.yml
          node .github/scripts/merge-update-manifests.mjs upload/latest.yml \
            artifacts/dist-win-x64/latest.yml \
            artifacts/dist-win-arm64/latest.yml

          echo "Staged release assets:"
          ls -la upload/

      # electron-builder normally creates the draft; with --publish never we do it
      # here. Idempotent while still a draft: a re-run reuses it and --clobber
      # overwrites. But once `notes` has made the release live, refuse to clobber
      # it — overwriting a published asset would briefly serve a manifest that
      # mismatches the asset being replaced (a v0.2.6-class window).
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPO" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPO" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published (non-draft). Refusing to clobber live assets. Delete the release and re-run the whole workflow to re-release."
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPO" --draft --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPO" --clobber upload/*

  # Sets the release body to GitHub's auto-generated changelog (PR titles + commit
  # subjects since the previous tag) AND publishes the draft (--draft=false), so
  # the release only goes live — and only becomes visible to auto-updaters — once
  # every arch is uploaded and the manifests are merged. Single job to avoid the
  # matrix-vs-release-body race that would happen if we patched the body earlier.
  notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=$(gh api -X POST "repos/${GITHUB_REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            --jq .body)
          gh release edit "${TAG}" --repo "${GITHUB_REPO}" --notes "${NOTES}" --draft=false --latest
