name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: |
          npx tsc --noEmit -p packages/core/tsconfig.json
          npx tsc --noEmit -p packages/ui/tsconfig.json
          npx tsc --noEmit -p packages/desktop/tsconfig.json
          npx tsc --noEmit -p packages/mcp/tsconfig.json

      - name: Lint
        run: npx eslint packages/*/src/

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      # Both .npmrc guards fail OPEN on an npm that doesn't know them: npm prints
      # a single `Unknown project config` warning and installs with no protection
      # at all. `strict-allow-scripts` only exists from npm 11.16.0, and Node
      # 24.0-24.17 ship an older npm — so assert the options are recognised
      # instead of trusting whatever npm the runner happens to bundle. Runs before
      # `npm ci` so a fail-open never silently installs.
      - name: Assert supply-chain guards are active
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for opt in strict-allow-scripts min-release-age; do
            val=$(npm config get "$opt")
            if [ "$val" = "undefined" ] || [ -z "$val" ]; then
              echo "::error::npm $(npm --version) does not recognise '$opt' — the .npmrc guard is silently inert. Needs npm >= 11.16.0."
              fail=1
            fi
          done
          if [ "$(npm config get strict-allow-scripts)" != "true" ]; then
            echo "::error::strict-allow-scripts is '$(npm config get strict-allow-scripts)', expected 'true' — dependency install scripts would run unreviewed."
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "OK: npm $(npm --version), strict-allow-scripts=$(npm config get strict-allow-scripts), min-release-age=$(npm config get min-release-age)"

      # An allowScripts entry can only be an exact version pin while its lockfile
      # entry carries `resolved` (npm derives trusted identity from that URL). If
      # an entry loses `resolved`/`integrity`, its pin silently stops matching and
      # a later `npm ci` fails with no clue why — 294 root entries were in exactly
      # that state before they were backfilled. Catch the regression here instead.
      - name: Verify every lockfile entry is integrity-pinned
        shell: bash
        run: |
          set -euo pipefail
          for lock in package-lock.json workers/signup/package-lock.json; do
            node -e "
              const p = require('./$lock').packages;
              const bad = Object.entries(p).filter(([k, v]) =>
                k.includes('node_modules/') && !v.link && (!v.resolved || !v.integrity));
              if (bad.length) {
                console.error('::error file=$lock::' + bad.length +
                  ' entries lack resolved/integrity, so they cannot be version-pinned: ' +
                  bad.slice(0, 5).map(([k]) => k).join(', '));
                process.exit(1);
              }
              console.log('$lock: all entries verified');
            "
          done

      - run: npm ci

      - name: Run audit-ci
        run: npx audit-ci --config audit-ci.json

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build workers
        run: npm run build:worker --workspace=packages/desktop

      - name: Test with coverage
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: ignore

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `workspaces` boots the app through the real workspace-resolution path
        # (COSTGOBLIN_USER_DATA_DIR, not the pinned dirs) — the only e2e coverage
        # of v0.7.0's multi-workspace feature. The test strips the pinned-mode
        # env vars below before launching, so it runs correctly in this matrix.
        # `csp-verification` and `sandbox-verification` are the repo's only
        # locks on the renderer security posture — cheap (seconds) but they
        # only protect anything if they actually run on PRs.
        shard: [views-core, views-config, views-defaults, stress, gcp-provider, workspaces, csp-verification, sandbox-verification]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fixtures are generated by playwright's globalSetup (e2e/global-setup.ts
      # → setup.ts, the complete generator incl. the cost-opt tier). The old
      # explicit generate.ts step produced a PARTIAL tree without cost-opt that
      # setup()'s freshness probe used to accept — the Findings suite then ran
      # against an empty recommendations view.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build desktop
        run: npm run build --workspace=packages/desktop
      - name: Run E2E shard
        env:
          COSTGOBLIN_DATA_DIR: ${{ github.workspace }}/packages/core/src/__fixtures__/synthetic
          COSTGOBLIN_CONFIG_DIR: ${{ github.workspace }}/packages/core/src/__fixtures__/config
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test e2e/${{ matrix.shard }}.test.ts
      - name: Collect E2E coverage
        if: always()
        run: npx tsx e2e/collect-coverage.ts
      - name: Upload E2E coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-e2e-${{ matrix.shard }}
          path: coverage-e2e/lcov.info
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  version-bump:
    name: version bumped past latest release
    runs-on: ubuntu-latest
    # PR-only: pushes to main shouldn't fail (main IS where the version
    # eventually equals a fresh tag, between bump and tagging).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full tag history needed to find the latest `v*` tag.
          fetch-depth: 0
      - name: Verify package.json is exactly one release ahead of the latest tag
        shell: bash
        run: |
          set -euo pipefail
          pkg_v=$(node -p "require('./package.json').version")
          desktop_v=$(node -p "require('./packages/desktop/package.json').version")
          if [ "$pkg_v" != "$desktop_v" ]; then
            echo "::error::root package.json ($pkg_v) and packages/desktop/package.json ($desktop_v) disagree — bump both together."
            exit 1
          fi
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
          echo "package.json version: $pkg_v"
          echo "Latest released tag : ${latest:-<none>}"
          if [ -z "$latest" ]; then
            echo "No v* tag exists yet — nothing to compare against; skipping."
            exit 0
          fi
          if ! printf '%s' "$latest" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Latest tag v$latest is not a plain X.Y.Z version — skipping the strict check."
            exit 0
          fi
          # package.json must sit EXACTLY one release ahead of the latest tag —
          # the next patch (X.Y.Z+1), minor (X.Y+1.0), or major (X+1.0.0). Once
          # main is already one ahead, later PRs inherit that version and need no
          # bump; only the first PR after a release bumps. This also rejects
          # over-incrementing (e.g. 0.2.8 while 0.2.7 was never released) and
          # regressions. `10#` forces base-10 so a value like `08` isn't read as
          # octal.
          IFS=. read -r maj min pat <<< "$latest"
          next_patch="${maj}.${min}.$((10#$pat + 1))"
          next_minor="${maj}.$((10#$min + 1)).0"
          next_major="$((10#$maj + 1)).0.0"
          case "$pkg_v" in
            "$next_patch"|"$next_minor"|"$next_major")
              echo "OK: $pkg_v is exactly one release ahead of v$latest"
              exit 0
              ;;
          esac
          if [ "$pkg_v" = "$latest" ]; then
            echo "::error file=package.json::version $pkg_v matches the latest released tag v$latest — bump it to $next_patch (or $next_minor / $next_major) before merging."
          else
            echo "::error file=package.json::version $pkg_v must be exactly one release ahead of the latest tag v$latest. Expected one of: $next_patch (patch), $next_minor (minor), $next_major (major). Don't skip or over-increment versions."
          fi
          exit 1

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-e2e]
    # Dependabot PRs run without repository secrets, so SONAR_TOKEN is empty and
    # the scan can only fail with "Not authorized". Skip it for those PRs (a
    # skipped job is treated as neutral, not failing). Dependency-only bumps have
    # no new source for Sonar to analyse anyway. Use pull_request.user.login (not
    # github.actor) so a maintainer re-running the job doesn't flip this back on.
    if: >-
      always()
      && needs.lint.result == 'success'
      && needs.test-unit.result == 'success'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-unit
          path: coverage
      # merge-multiple is deliberately OFF: every shard's artifact contains a
      # file named exactly `lcov.info`, so a merged download would overwrite
      # them and forward a single arbitrary shard to Sonar. Each artifact
      # extracts into its own coverage-e2e-shards/<artifact-name>/ dir instead.
      - name: Download E2E coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-e2e-*
          path: coverage-e2e-shards
        continue-on-error: true
      # Concatenating lcov files is safe: Sonar merges duplicate SF records,
      # taking a line as covered if any report covers it. The guard is
      # fail-CLOSED: when the e2e matrix succeeded, every shard listed below
      # must have produced a NON-EMPTY lcov.info — with e2e green, a missing
      # or empty shard is by construction a coverage-pipeline bug, not a test
      # failure. When e2e itself failed, missing shards are expected and only
      # warned about.
      - name: Merge E2E coverage
        env:
          E2E_RESULT: ${{ needs.test-e2e.result }}
        run: |
          set -euo pipefail
          # Shards expected to upload coverage. csp/sandbox-verification
          # deliberately collect none. Keep in sync with the writeCoverage
          # calls in e2e/*.test.ts.
          expected="views-core views-config views-defaults stress gcp-provider workspaces"
          missing=0
          mkdir -p coverage-e2e
          : > coverage-e2e/lcov.info
          for shard in $expected; do
            f="coverage-e2e-shards/coverage-e2e-$shard/lcov.info"
            if [ -s "$f" ]; then
              # printf guards the record boundary even if a shard's file
              # arrives without its trailing newline.
              cat "$f" >> coverage-e2e/lcov.info
              printf '\n' >> coverage-e2e/lcov.info
              echo "merged: $shard"
            else
              echo "::warning::E2E coverage shard '$shard' is missing or empty."
              missing=1
            fi
          done
          if [ "$missing" = 1 ] && [ "$E2E_RESULT" = "success" ]; then
            echo "::error::test-e2e succeeded but at least one coverage shard is missing/empty — the coverage pipeline is broken."
            exit 1
          fi
          if ! [ -s coverage-e2e/lcov.info ]; then
            rm -f coverage-e2e/lcov.info
            echo "::warning::No E2E coverage at all — Sonar runs with unit coverage only."
          fi
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
