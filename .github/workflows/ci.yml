name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: |
          npx tsc --noEmit -p packages/core/tsconfig.json
          npx tsc --noEmit -p packages/ui/tsconfig.json
          npx tsc --noEmit -p packages/desktop/tsconfig.json

      - name: Lint
        run: npx eslint packages/*/src/

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run audit-ci
        run: npx audit-ci --config audit-ci.json

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build workers
        run: npm run build:worker --workspace=packages/desktop

      - name: Test with coverage
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: ignore

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [views-core, views-config, stress]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate fixtures
        run: npx tsx packages/core/src/__fixtures__/generate.ts --generate
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build desktop
        run: npm run build --workspace=packages/desktop
      - name: Run E2E shard
        env:
          COSTGOBLIN_DATA_DIR: ${{ github.workspace }}/packages/core/src/__fixtures__/synthetic
          COSTGOBLIN_CONFIG_DIR: ${{ github.workspace }}/packages/core/src/__fixtures__/config
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test e2e/${{ matrix.shard }}.test.ts
      - name: Collect E2E coverage
        if: always()
        run: npx tsx e2e/collect-coverage.ts
      - name: Upload E2E coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-e2e-${{ matrix.shard }}
          path: coverage-e2e/lcov.info
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-e2e]
    if: always() && needs.lint.result == 'success' && needs.test-unit.result == 'success'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-unit
          path: coverage
      - name: Download E2E coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-e2e-*
          path: coverage-e2e-shards
          merge-multiple: true
        continue-on-error: true
      - name: Merge E2E coverage
        run: |
          mkdir -p coverage-e2e
          cat coverage-e2e-shards/lcov.info > coverage-e2e/lcov.info 2>/dev/null || true
        continue-on-error: true
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
