name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: |
          npx tsc --noEmit -p packages/core/tsconfig.json
          npx tsc --noEmit -p packages/ui/tsconfig.json
          npx tsc --noEmit -p packages/desktop/tsconfig.json
          npx tsc --noEmit -p packages/mcp/tsconfig.json

      - name: Lint
        run: npx eslint packages/*/src/

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run audit-ci
        run: npx audit-ci --config audit-ci.json

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build workers
        run: npm run build:worker --workspace=packages/desktop

      - name: Test with coverage
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: ignore

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [views-core, views-config, stress]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate fixtures
        run: npx tsx packages/core/src/__fixtures__/generate.ts --generate
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build desktop
        run: npm run build --workspace=packages/desktop
      - name: Run E2E shard
        env:
          COSTGOBLIN_DATA_DIR: ${{ github.workspace }}/packages/core/src/__fixtures__/synthetic
          COSTGOBLIN_CONFIG_DIR: ${{ github.workspace }}/packages/core/src/__fixtures__/config
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test e2e/${{ matrix.shard }}.test.ts
      - name: Collect E2E coverage
        if: always()
        run: npx tsx e2e/collect-coverage.ts
      - name: Upload E2E coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-e2e-${{ matrix.shard }}
          path: coverage-e2e/lcov.info
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  version-bump:
    name: version bumped past latest release
    runs-on: ubuntu-latest
    # PR-only: pushes to main shouldn't fail (main IS where the version
    # eventually equals a fresh tag, between bump and tagging).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full tag history needed to find the latest `v*` tag.
          fetch-depth: 0
      - name: Verify package.json version is ahead of latest released tag
        shell: bash
        run: |
          set -euo pipefail
          pkg_v=$(node -p "require('./package.json').version")
          desktop_v=$(node -p "require('./packages/desktop/package.json').version")
          if [ "$pkg_v" != "$desktop_v" ]; then
            echo "::error::root package.json ($pkg_v) and packages/desktop/package.json ($desktop_v) disagree — bump both together."
            exit 1
          fi
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
          echo "package.json version: $pkg_v"
          echo "Latest released tag : ${latest:-<none>}"
          if [ -z "$latest" ]; then
            echo "No v* tag exists yet — nothing to compare against; skipping."
            exit 0
          fi
          if [ "$pkg_v" = "$latest" ]; then
            echo "::error file=package.json::version $pkg_v matches the latest released tag v$latest — bump it before merging so the next release has a fresh version to tag."
            exit 1
          fi
          # Defence-in-depth: also reject regressions, since release.yml's
          # tag-vs-package.json guard only catches them at tag-push time.
          highest=$(printf '%s\n%s\n' "$pkg_v" "$latest" | sort -V | tail -n1)
          if [ "$highest" != "$pkg_v" ]; then
            echo "::error file=package.json::version $pkg_v is older than the latest released tag v$latest."
            exit 1
          fi
          echo "OK: $pkg_v > $latest"

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-e2e]
    if: always() && needs.lint.result == 'success' && needs.test-unit.result == 'success'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-unit
          path: coverage
      - name: Download E2E coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-e2e-*
          path: coverage-e2e-shards
          merge-multiple: true
        continue-on-error: true
      - name: Merge E2E coverage
        run: |
          mkdir -p coverage-e2e
          cat coverage-e2e-shards/lcov.info > coverage-e2e/lcov.info 2>/dev/null || true
        continue-on-error: true
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
