appId: com.costgoblin.app
productName: CostGoblin
# Makes node_modules/@duckdb arch-correct before packing each arch. The release
# matrix builds both x64 and arm64 on a single-arch runner, where npm only
# installs the host-arch DuckDB binding; this swaps in the right one per arch so
# secondary-arch installers don't crash on launch. Relies on sequential per-arch
# packing — do NOT set concurrency.jobs >= 2 (it would race the shared node_modules).
beforePack: ./scripts/before-pack.cjs
directories:
  buildResources: build
  output: dist
files:
  - "packages/desktop/out/**/*"
  - "node_modules/**/*"
buildDependenciesFromSource: false
nodeGypRebuild: false
npmRebuild: false
asar: true
asarUnpack:
  - "node_modules/@duckdb/**"
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.business
  notarize: true
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
publish:
  provider: github
  vPrefixedTagName: true
  # Upload artifacts to a DRAFT release so it never shows up as "latest"
  # (and so electron-updater never sees it) until every platform job has
  # uploaded its manifest + binaries. The `notes` job publishes the draft
  # (gh release edit --draft=false) once all matrix builds finish. Without
  # this, a fast platform publishes the release while mac is still
  # notarizing, leaving latest-mac.yml 404ing for minutes.
  releaseType: draft
