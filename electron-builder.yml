appId: com.costgoblin.app
productName: CostGoblin
directories:
  buildResources: build
  output: dist
files:
  - "packages/desktop/out/**/*"
  - "node_modules/**/*"
buildDependenciesFromSource: false
nodeGypRebuild: false
npmRebuild: false
asar: true
asarUnpack:
  - "node_modules/@duckdb/**"
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.business
  notarize: true
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64
        - arm64
snap:
  confinement: classic
  summary: Cloud cost visibility for AWS billing analysis
  description: |
    CostGoblin is a desktop app for analyzing AWS cloud costs locally.
    It syncs billing data from S3, stores it as Parquet, and enables
    fast querying with DuckDB. Designed for FinOps engineers and platform teams.
  grade: stable
publish:
  provider: github
  vPrefixedTagName: true
  releaseType: release
