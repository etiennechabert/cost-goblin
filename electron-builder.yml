appId: com.costgoblin.app
productName: CostGoblin
directories:
  buildResources: build
  output: dist
files:
  - "packages/desktop/dist/**/*"
  - "packages/ui/dist/**/*"
  - "packages/core/dist/**/*"
  - "node_modules/**/*"
asar: true
asarUnpack:
  - "node_modules/duckdb/**"
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.business
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
publish:
  provider: github
