appId: com.costgoblin.app
productName: CostGoblin
directories:
  buildResources: build
  output: dist
files:
  - "packages/desktop/out/**/*"
  - "node_modules/**/*"
buildDependenciesFromSource: false
nodeGypRebuild: false
npmRebuild: false
asar: true
asarUnpack:
  - "node_modules/@duckdb/**"
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.business
  notarize: true
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
publish:
  provider: github
  vPrefixedTagName: true
  # Upload artifacts to a DRAFT release so it never shows up as "latest"
  # (and so electron-updater never sees it) until every platform job has
  # uploaded its manifest + binaries. The `notes` job publishes the draft
  # (gh release edit --draft=false) once all matrix builds finish. Without
  # this, a fast platform publishes the release while mac is still
  # notarizing, leaving latest-mac.yml 404ing for minutes.
  releaseType: draft
